<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>導入MOD一覧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      height: 100vh;
      color: #333;
      background-color: #f9f9f9;
    }

    /* サイドバー */
    sidebar {
      width: 280px;
      background-color: #24292e;
      color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
    }
    .sidebar-header {
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border-bottom: 1px solid #444d56;
      background-color: #1f2328;
    }
    .file-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    .file-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #3f4448;
      transition: background-color 0.2s;
    }
    .file-item:hover {
      background-color: #2c3238;
    }
    .file-item.active {
      background-color: #0366d6;
      font-weight: bold;
    }

    /* メインコンテンツ */
    main {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .empty-state {
      margin: auto;
      color: #6a737d;
      font-size: 1.1rem;
    }
    .content-card {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid #e1e4e8;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }
    .description {
      font-size: 1rem;
      color: #586069;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .divider {
      border: 0;
      height: 1px;
      background: #e1e4e8;
      margin: 20px 0;
    }
    .main-content {
      font-size: 1.05rem;
      line-height: 1.7;
      white-space: pre-wrap; /* 改行を保持 */
      color: #24292e;
    }

    /* カスタム説明タグ用スタイル (Tooltip) */
    .custom-desc-tooltip {
      position: relative;
      display: inline-block;
      cursor: help;
    }
    .custom-desc-tooltip .tooltip-text {
      visibility: hidden;
      width: max-content;
      max-width: 260px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 6px 10px;
      position: absolute;
      z-index: 10;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 0.85rem;
      line-height: 1.4;
      font-weight: normal;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      white-space: normal;
      pointer-events: none;
    }
    .custom-desc-tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

  <sidebar>
    <div class="sidebar-header">導入MOD一覧</div>
    <ul class="file-list" id="fileList"></ul>
  </sidebar>

  <main id="mainContainer">
    <div class="empty-state">左のリストから選択してください</div>
  </main>

  <script>
    const CONFIG_DIR = './configuration/';
    const LIST_FILE = CONFIG_DIR + 'list.json';

    // キャッシュ回避付きの fetch 関数
    async function fetchWithoutCache(url) {
      const cacheBusterUrl = `${url}?_=${Date.now()}`;
      return await fetch(cacheBusterUrl, { cache: 'no-store' });
    }

    async function init() {
      try {
        const response = await fetchWithoutCache(LIST_FILE);
        if (!response.ok) throw new Error('list.json が見つかりませんでした。');
        const files = await response.json();
        
        // 全ファイルを事前に取得してタイトルを取り出す
        const fileDataList = await Promise.all(files.map(async (fileName) => {
          try {
            const res = await fetchWithoutCache(CONFIG_DIR + fileName);
            if (!res.ok) return null;
            const text = await res.text();
            const parsed = parseCustomTxt(text);
            return {
              fileName: fileName,
              title: parsed.title || fileName,
              rawText: text
            };
          } catch {
            return null;
          }
        }));

        renderSidebar(fileDataList.filter(item => item !== null));
      } catch (err) {
        console.error(err);
        document.getElementById('fileList').innerHTML = 
          `<li style="padding:16px; color:#f97583;">読み込みエラー: list.json を確認してください</li>`;
      }
    }

    function renderSidebar(items) {
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'file-item';
        li.textContent = item.title;
        li.onclick = () => loadAndDisplayFile(item, li);
        listEl.appendChild(li);

        if (index === 0) {
          loadAndDisplayFile(item, li);
        }
      });
    }

    function loadAndDisplayFile(item, element) {
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');

      const parsed = parseCustomTxt(item.rawText);

      // タグの処理適用
      const processedTitle = processCustomTags(parsed.title);
      const processedDesc = processCustomTags(parsed.description);
      const processedMain = processCustomTags(parsed.main);

      const mainContainer = document.getElementById('mainContainer');
      mainContainer.innerHTML = `
        <div class="content-card">
          <h1 class="title">${processedTitle}</h1>
          <div class="description">${processedDesc}</div>
          <hr class="divider">
          <div class="main-content">${processedMain}</div>
        </div>
      `;
    }

    // パース処理 (title, description, main の抽出)
    function parseCustomTxt(text) {
      let title = '';
      let description = '';
      let main = '';

      const titleMatch = text.match(/^title:\s*(.*)$/m);
      const descMatch = text.match(/^description:\s*(.*)$/m);
      const mainIndex = text.indexOf('main:');

      if (titleMatch) title = titleMatch[1].trim();
      if (descMatch) description = descMatch[1].trim();
      if (mainIndex !== -1) {
        main = text.substring(mainIndex + 5).trim();
      }

      return { title, description, main };
    }

// カスタムタグ（関数）の処理エンジン
    function processCustomTags(text) {
      if (!text) return '';

      // 1. <tnum_st> から <tnum_en> までの行数を正確に計算
      if (text.includes('<tnum_st>') && text.includes('<tnum_en>')) {
        const stIndex = text.indexOf('<tnum_st>') + '<tnum_st>'.length;
        const enIndex = text.indexOf('<tnum_en>');
        
        if (stIndex < enIndex) {
          const subText = text.substring(stIndex, enIndex);
          // 改行で分割し、完全な空行（前後の改行のみで挟まれた部分）を除外してカウント
          const lines = subText.split(/\r?\n/).filter(line => line.trim() !== '');
          const lineCount = lines.length;
          text = text.replace(/<tnum>/g, lineCount);
        }
      }
      // マーカータグを削除
      text = text.replace(/<tnum_st>/g, '').replace(/<tnum_en>/g, '');

      // 2. 安全のためHTML特殊文字を事前にエスケープ
      let html = escapeHtml(text);

      // 3. <color:reset> を自動で <color:#000000> として読み替える
      html = html.replace(/&lt;color:reset&gt;/g, '&lt;color:#000000&gt;');

      // 4. <color:hex> の置換処理
      html = html.replace(/&lt;color:(#[0-9a-fA-F]{3,8}|[a-zA-Z]+)&gt;/g, '<span style="color: $1;">');

      // 5. <description:{description}:{display}:{clr}:{is_underbar}> の置換
      const descRegex = /&lt;description:(.*?):(.*?):(.*?):(true|false)&gt;/g;
      html = html.replace(descRegex, (match, desc, display, clr, isUnderbar) => {
        const borderStyle = isUnderbar === 'true' ? `border-bottom: 2px dashed ${clr};` : '';
        return `<span class="custom-desc-tooltip" style="color: ${clr}; ${borderStyle}">` +
                 `${display}` +
                 `<span class="tooltip-text">${desc}</span>` +
               `</span>`;
      });

      return html;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    init();
  </script>
</body>
</html>
